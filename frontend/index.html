<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-[#eef1f6] text-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyPilot AI - 智慧高中生學習領航員</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'],
            clock: ['"Share Tech Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f3ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
    <style>
    /* Custom Brutalist scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #eef1f6;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 3D Flip Clock Styles */
    .perspective-flip {
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    .flip-top-down {
      transform-origin: 50% 100%;
      animation: flipTopDown 0.25s ease-in forwards;
      backface-visibility: hidden;
    }

    .flip-bottom-down {
      transform-origin: 50% 0%;
      animation: flipBottomDown 0.25s ease-out 0.25s forwards;
      backface-visibility: hidden;
    }

    @keyframes flipTopDown {
      0% {
        transform: rotateX(0deg);
      }
      100% {
        transform: rotateX(-90deg);
      }
    }

    @keyframes flipBottomDown {
      0% {
        transform: rotateX(90deg);
      }
      100% {
        transform: rotateX(0deg);
      }
    }

    /* Glossy Sheen */
    .flip-gloss {
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 50%, rgba(0,0,0,0.15) 100%);
    }

    .flip-shadow {
      box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.4), 0 10px 25px -3px rgba(0, 0, 0, 0.5);
    }

    /* Physical Mouse Hover Border Glow Effect */
    .glow-card {
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .glow-card::before {
      content: "";
      position: absolute;
      inset: -1.5px;
      border-radius: inherit;
      padding: 2px;
      background: radial-gradient(
        350px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(99, 102, 241, 0.95),
        rgba(244, 63, 94, 0.8) 35%,
        rgba(251, 191, 36, 0.6) 65%,
        transparent 85%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 10;
    }

    .glow-card:hover::before {
      opacity: 1;
    }
  </style>
</head>
<body class="h-full antialiased font-sans bg-[#eef1f6] text-slate-950 selection:bg-black selection:text-white">
  <div id="root" class="h-full"></div>
<script type="module" src="/index.js"></script></body>
</html>
